<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset Comic</title>
<link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Rubik:wght@500;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root { --ink: #160c22; --paper: #f4ead8; }
  html, body { margin: 0; height: 100%; background: #0d0814; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; }
  /* the desk under the pages */
  #desk { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #2a1a3e 0%, #120a1c 70%); }
  .page { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform, opacity; }
  .page .sheet { position: absolute; inset: 0; background: var(--paper); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .page .sheet::after { content: ''; position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply;
    background-image: radial-gradient(rgba(120,90,60,.10) 1px, transparent 1.2px); background-size: 5px 5px; }
  .cell { position: absolute; overflow: hidden; background: #000; opacity: 0; transform: scale(.85); transition: opacity .35s, transform .45s cubic-bezier(.2,1.4,.4,1); }
  .cell.on { opacity: 1; transform: none; }
  .cell img { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.05); }
  .cell .edge { position: absolute; inset: 0; pointer-events: none; }
  .cell.seen img { filter: saturate(.92) brightness(.97); }
  /* the panel in play: up from its cell to the whole frame */
  #focus { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; }
  #focus .pic { position: absolute; inset: -2%; background-size: cover; background-position: center; will-change: transform; }
  #focus .frame { position: absolute; inset: 0; border: 14px solid var(--ink); box-shadow: inset 0 0 0 4px #fff3; }
  #focus .grain { position: absolute; inset: 0; opacity: .12; mix-blend-mode: overlay;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px); }
  /* balloons */
  .bal { position: absolute; transform-origin: var(--ox) var(--oy); transform: scale(0); opacity: 0; transition: transform .38s cubic-bezier(.2,1.6,.4,1), opacity .2s; }
  .bal.on { transform: scale(1); opacity: 1; }
  .bal svg { position: absolute; inset: 0; overflow: visible; }
  .bal .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 6%; font-family: 'Rubik', sans-serif; font-weight: 700; color: var(--ink); line-height: 1.15; direction: rtl; }
  .bal.shaky .txt { animation: shake .09s infinite alternate; }
  @keyframes shake { from { transform: translate(-1px, .5px); } to { transform: translate(1px, -.5px); } }
  .who { position: absolute; top: -0.9em; right: 8%; font: 800 0.55em 'Rubik', sans-serif; letter-spacing: .04em; padding: .08em .5em; border-radius: .3em; color: #fff; background: var(--ink); }
  /* sound words */
  .sfx { position: absolute; transform: translate(-50%, -50%) scale(0) rotate(var(--r)); font-family: 'Rubik', sans-serif; font-weight: 900; font-style: italic;
    color: var(--c); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--ink); white-space: nowrap; transition: transform .3s cubic-bezier(.2,1.8,.4,1), opacity .3s; opacity: 0; }
  .sfx.on { transform: translate(-50%, -50%) scale(1) rotate(var(--r)); opacity: 1; }
  .sfx.faint { -webkit-text-stroke: 0; text-shadow: none; opacity: 0; transition: opacity 1.4s; font-weight: 500; letter-spacing: .2em; }
  .sfx.faint.on { opacity: .75; }
  /* page turn, the end */
  #title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; opacity: 0; transition: opacity .8s; }
  #title .t { font: 900 110px 'Rubik', sans-serif; letter-spacing: .02em; -webkit-text-stroke: 3px #000; }
  #title .s { font: 500 30px 'Rubik', sans-serif; opacity: .8; margin-top: 10px; }
  #black { position: absolute; inset: 0; background: #000; opacity: 1; transition: opacity .9s; pointer-events: none; }
  #play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 34px 'Rubik', sans-serif; padding: 18px 40px; border-radius: 40px; border: 0; background: #ffd23f; color: #160c22; cursor: pointer; z-index: 5; }
</style>
</head>
<body>
<div id="stage">
  <div id="desk"></div>
  <div id="pages"></div>
  <div id="focus"><div class="pic"></div><div class="grain"></div><div class="frame"></div><div class="layer"></div></div>
  <div id="title"><div class="t">השקיעה האחרונה</div><div class="s">פרק 1</div></div>
  <div id="black"></div>
</div>
<button id="play">▶ צפייה</button>
<script type="module" src="comic.js"></script>
</body>
</html>
