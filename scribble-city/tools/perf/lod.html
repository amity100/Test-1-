function closest(px, py, pz, ax, ay, az, bx, by, bz, cx, cy, cz) {

  if (d6 >= 0 && d5 <= d6) return cpx * cpx + cpy * cpy + cpz * cpz;
  const vb = d5 * d2 - d1 * d6;

}

// ---------------------------------------------------------------- the base head
function headData() {

  g.setAttribute('position', new THREE.BufferAttribute(B.pos, 3));
  g.setIndex(new THREE.BufferAttribute(B.idx, 1));

  return { pos: B.pos, idx: B.idx, uv: B.uv, mouth: B.mouth, nor, mv, E, n };

const HD = headData();

window.headInfo = () => {
  const { idx, pos, n } = HD;
  const edges = new Map();
  for (let t = 0; t < idx.length; t += 3) for (const [a, b] of [[idx[t], idx[t + 1]], [idx[t + 1], idx[t + 2]], [idx[t + 2], idx[t]]]) {
    const k = a < b ? a * n + b : b * n + a;

// cfg: { maxErr (m), uvTol, norTol, mouthTol, moveTol (m), creaseCos, flipCos, measure }
window.headTrial = (cfg) => {
  const attrs = [];

  if (cfg.norTol) attrs.push({ a: HD.nor, dim: 3, tol: cfg.norTol });
  if (cfg.mouthTol) attrs.push({ a: HD.mouth, dim: 1, tol: cfg.mouthTol });

  const ms = performance.now() - t0;

}

// ---------------------------------------------------------------- the people as the game builds them
// (a PersonRenderer on a scene of its own, nothing drawn: its shapes, the layouts of triangles they share, and the

const PR = await import('/v5/js/render/people.js');

    let tries = 0;
    // (first the other side of the limit, then halving between)
    for (let it = 0; it < 9; it++) {
      const r = tryAt(L, e0);
      tries++;
      if (r.devMax <= lim) {
        if (!good || r.maxErr > good.maxErr) good = r;
      } else if (!bad || r.maxErr < bad.maxErr) bad = r;
      if (good && bad) {
        if (bad.maxErr / good.maxErr < 1.06) break;
        e0 = Math.sqrt(good.maxErr * bad.maxErr);
      } else e0 = good ? Math.min(0.012, e0 * 1.5) : e0 * 0.6;
      if (good && !bad && good.maxErr >= 0.012) break;
    }
    const f = good || tryAt(L, e0 * 0.5);
    out.levels.push({ tris: f.tris, errMm: +(f.maxErr * 1000).toFixed(2), devMax: +f.devMax.toFixed(2), devP99: +f.devP99.toFixed(2), ms: +f.ms.toFixed(0), iter: tries - 1, ok: !!good, b64: b64of(Uint16Array.from(f.index)) });
  }
  return out;
};
// ---------------------------------------------------------------- the shops' products
// (ROADMAP 19.3) every model the shops make: its triangles in the full make and in the low one (a phone's)
window.productInfo = async (maxErrMm = 5) => {
  const PR = await import('/v5/js/world/products.js');
  const names = PR.modelNames ? PR.modelNames() : [];
  const rows = [];
  // (the far make tried here only: a product's low make in fewer triangles over a part of its corners - it saved
  // too little to be worth a place in the game, ROADMAP 19.3)
  const lighter = (p, maxErr) => {
    const nv = p.P.length / 3;
    const nt = p.X.length / 3;
    if (nt < 14) return { P: p.P, X: p.X, same: true };
    const pos = Float32Array.from(p.P);
    const nor = new Float32Array(nv * 3);
    for (let i = 0; i < nv; i++) {
      const l = Math.hypot(p.N[i * 3], p.N[i * 3 + 1], p.N[i * 3 + 2]) || 1;
      nor[i * 3] = p.N[i * 3] / l; nor[i * 3 + 1] = p.N[i * 3 + 1] / l; nor[i * 3 + 2] = p.N[i * 3 + 2] / l;
    }
    const uv = Float32Array.from(p.U);
    let sum = 0, cnt = 0;
    for (let t = 0; t < nt; t++) for (let k = 0; k < 3; k++) {
      const a = p.X[t * 3 + k], b = p.X[t * 3 + ((k + 1) % 3)];
      const dp = Math.hypot(pos[a * 3] - pos[b * 3], pos[a * 3 + 1] - pos[b * 3 + 1], pos[a * 3 + 2] - pos[b * 3 + 2]);
      const du = Math.hypot(uv[a * 2] - uv[b * 2], uv[a * 2 + 1] - uv[b * 2 + 1]);
      if (dp > 1e-5) { sum += du / dp; cnt++; }
    }
    const rho = cnt ? sum / cnt : 1;
    const r = simplify(Uint32Array.from(p.X), pos, { maxErr, nor, creaseCos: 0.5, attrs: [{ a: uv, dim: 2, tol: 0.006 * Math.max(rho, 1) }, { a: nor, dim: 3, tol: 0.5 }] });
    if (r.triangles > nt * 0.85) return { P: p.P, X: p.X, same: true };
    return { P: p.P, X: Array.from(r.index), same: false };
  };
  for (const n of names) {
    try {
      const full = PR.model(n, false);
      const low = PR.model(n, true);
      const cnt = (m) => m.parts.reduce((a, p) => a + p.X.length / 3, 0);
      let far = 0;
      let dev = 0;
      let p99 = 0;
      for (const A of low.parts) {
        const F = lighter(A, maxErrMm / 1000);
        far += F.X.length / 3;
        if (F.same) continue;
        const d = deviation(Float32Array.from(A.P), Uint32Array.from(A.X), Uint32Array.from(F.X), 0.01);
        dev = Math.max(dev, d.full_to_light.max, d.light_to_full.max);
        p99 = Math.max(p99, d.full_to_light.p99, d.light_to_full.p99);
      }
      rows.push({ name: n, full: cnt(full), low: cnt(low), far, farVerts: 0, lowVerts: low.verts, devMm: +dev.toFixed(2), p99Mm: +p99.toFixed(2), parts: full.parts.length });
    } catch (e) {
      rows.push({ name: n, error: String(e.message || e).slice(0, 80) });
    }
  }
  return rows;
};
window.ready = true;
